<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Guide to the 55 Trophies of Grand Theft Auto VI</title>
<meta name="description" content="Offline guide and tracker for the 55 PlayStation 5 trophies of Grand Theft Auto VI.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead">
  <div class="title">
    <p class="kicker">Field guide, PlayStation 5</p>
    <h1>The 55 Trophies of Grand Theft Auto VI</h1>
  </div>
  <div class="head-right">
    <nav id="tabs" aria-label="Views">
      <a href="#view=checklist" data-view="checklist">Checklist</a>
      <a href="#view=roadmap" data-view="roadmap">Roadmap</a>
      <a href="#view=tracker" data-view="tracker">Tracker</a>
    </nav>
    <label class="switch" title="Hide the names and descriptions of unearned story trophies">
      <input type="checkbox" id="spoilers"> <span>Hide story spoilers</span>
    </label>
  </div>
</header>
<div class="progressline">
  <div class="bar" role="progressbar" aria-label="Trophies earned" aria-valuemin="0" aria-valuemax="55" id="bar"><i id="barfill"></i></div>
  <p id="count" aria-live="polite"></p>
</div>
<main id="main"></main>
<footer>
  <p>Names, descriptions and grades are as PlayStation publishes them. Guides are written for this guide and cite the pages named beside each trophy. Progress is stored only in this browser.</p>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
